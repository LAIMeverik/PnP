<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMT Navigator Web</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #eee; }
    .wrap { padding: 16px; max-width: 1400px; margin: 0 auto; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .panel { border: 1px solid #2f2f2f; border-radius: 10px; background: #1a1a1a; padding: 12px; margin-top: 12px; }
    .slot-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
    .slot { border-radius: 6px; padding: 8px; border: 1px solid #333; background: #222; font-size: 12px; min-height: 44px; cursor: pointer; }
    .slot.active { background: #1b5e20; border-color: #4caf50; }
    .slot.keep { background: #d84315; border-color: #ff7043; }
    .slot.remove { background: #5d4037; border-color: #8d6e63; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #333; padding: 6px; }
    th { background: #222; }
    tr.done { background: #1b5e20; }
    .ok { color: #4caf50; }
    .warn { color: #ff7043; }
    .err { color: #ff5252; }
    button, select, input { background: #202020; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 6px 8px; }
    button { cursor: pointer; }
    .progress-row { display: grid; grid-template-columns: 220px 1fr 70px; gap: 8px; align-items: center; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SMT Navigator Web</h1>

    <div class="panel">
      <div class="row">
        <input id="bomFile" type="file" accept=".xlsx,.xls" />
        <button id="uploadBomBtn">Загрузить BOM</button>
        <button id="calcBtn">Рассчитать базу</button>
        <button id="nextBtn">Следующий заход</button>
        <label>Плата:</label>
        <select id="boardSel"></select>
      </div>
      <div id="status" class="warn" style="margin-top:8px;"></div>
      <div id="summary" style="margin-top:8px;"></div>
    </div>

    <div class="panel">
      <h3>Лимиты павука (слоты по ширинам)</h3>
      <div class="row" id="tapeLimits"></div>
      <button id="saveLimitsBtn" style="margin-top:8px;">Сохранить лимиты</button>
    </div>

    <div class="panel">
      <h3>Прогресс</h3>
      <div id="progress"></div>
    </div>

    <div class="panel">
      <h3>Чипшутер L5-R29 (клик по слоту: снять деталь из станка)</h3>
      <div id="chipGrid" class="slot-grid"></div>
    </div>

    <div class="panel">
      <h3>Павук (установленные)</h3>
      <table id="spiderTable"></table>
    </div>

    <div class="panel">
      <h3>Карта заправки (двойной клик: отметить/снять в setup)</h3>
      <table id="setupTable"></table>
    </div>

    <div class="panel">
      <h3>Список установки (двойной клик: отметить/снять в instr)</h3>
      <table id="instrTable"></table>
    </div>

    <div class="panel">
      <h3>Склад</h3>
      <div class="row">
        <input id="whExcelFile" type="file" accept=".xlsx,.xls" />
        <button id="uploadWhBtn">Загрузить склад из Excel</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <input id="whNum" placeholder="Номер" />
        <input id="whName" placeholder="Название" />
        <input id="whWidth" type="number" value="8" min="8" />
        <input id="whQty" type="number" value="0" min="0" />
        <button id="addWhBtn">Добавить вручную</button>
      </div>
      <table id="warehouseTable" style="margin-top:8px;"></table>
    </div>
  </div>

  <script src="/Legacy/static/static/app.js"></script>
</body>
</html>
